name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - run: ./tools/Verify.ps1
      - run: dotnet publish src/SherpaAxis.Cli -c Release --no-restore --no-build -o publish
      - name: Build Windows installer
        run: ./tools/Build-SetupPackage.ps1
      - name: Verify installer lifecycle
        run: ./tools/Test-SetupPackage.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SherpaAxis-Windows-x64
          path: publish/Setup.exe
          if-no-files-found: error
